name: push-mcp-image.yml

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push the Docker image
        run: docker build -f ./src/CounterAssistant.MCP/Dockerfile --push --build-arg GITHUB_SHA=${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/counter-assistant-mcp:${{ github.sha }} --platform linux/arm64 .
