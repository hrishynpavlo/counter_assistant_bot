name: Docker Image CI

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Define IMAGE_TAG
      id: vars
      run: echo "IMAGE_TAG=counter-assistant-bot:$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ github.repository_owner }}/$IMAGE_TAG

    - name: Push the Docker image
      run: docker push ghcr.io/${{ github.repository_owner }}/$IMAGE_TAG
